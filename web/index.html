<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Elloten — powered by Ello5</title>
    <meta
      name="description"
      content="Elloten is the chat UX for Ello5 — private Elite Coding AI."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="rail" id="rail" aria-label="Sidebar">
        <div class="rail-top">
          <a class="brand" href="/" aria-label="Elloten home">
            <span class="brand-mark" aria-hidden="true"></span>
            <span class="brand-name">Elloten</span>
          </a>
          <button type="button" class="btn-new" id="new-chat" title="New chat">
            <span class="plus" aria-hidden="true">+</span>
            New chat
          </button>
        </div>
        <nav class="rail-chats" id="chat-list" aria-label="Chats"></nav>
        <div class="rail-foot">
          <div class="model-chip" title="Active model">
            <span class="dot" id="status-dot" data-state="loading"></span>
            <span>Model · <strong id="model-label">Ello5</strong></span>
          </div>
          <p class="rail-note">Ello5 is the AI model. Elloten is the workspace.</p>
        </div>
      </aside>

      <div class="shell">
        <header class="topbar">
          <button type="button" class="icon-btn mobile-only" id="toggle-rail" aria-label="Menu">
            ☰
          </button>
          <div class="topbar-title">
            <span class="product">Elloten</span>
            <span class="sep" aria-hidden="true">/</span>
            <label class="model-select-wrap">
              <span class="sr-only">Model</span>
              <select id="model" name="model" aria-label="Model">
                <option value="ellofive" selected>Ello5 · Pro</option>
                <option value="ellofive-fast">Ello5 · Fast</option>
                <option value="models5">Ello5 · models5</option>
              </select>
            </label>
          </div>
          <div class="topbar-meta">
            <span id="status" class="status" data-state="loading">Connecting…</span>
          </div>
        </header>

        <main class="stage" id="stage">
          <section class="welcome" id="welcome">
            <div class="welcome-inner">
              <h1 class="welcome-brand">Elloten</h1>
              <p class="welcome-sub">
                A calm workspace for <em>Ello5</em> — Elite Coding System.
                Ask, draft, refine.
              </p>
              <div class="suggestions" id="suggestions">
                <button type="button" data-prompt="What makes dogs good companions? Answer in 2 short sentences.">
                  <span class="sug-kicker">Curious</span>
                  Ask Ello5 about dogs
                </button>
                <button type="button" data-prompt="Write a tiny Python function is_even(n) with a one-line docstring. Under 8 lines.">
                  <span class="sug-kicker">Code</span>
                  Tiny Python helper
                </button>
                <button type="button" data-prompt="Give me 5 small coding tasks I can practice today. Number them briefly.">
                  <span class="sug-kicker">Plan</span>
                  Practice task list
                </button>
                <button type="button" data-prompt="Review this idea: a secure FastAPI /health endpoint with tests. Outline the files and risks.">
                  <span class="sug-kicker">Build</span>
                  Secure health endpoint
                </button>
              </div>
            </div>
          </section>

          <section class="thread-wrap" id="thread-wrap" hidden>
            <div class="thread" id="thread" role="log" aria-live="polite"></div>
          </section>
        </main>

        <footer class="composer-dock">
          <form class="composer" id="composer">
            <div class="composer-shell">
              <label class="sr-only" for="prompt">Message Ello5</label>
              <textarea
                id="prompt"
                name="prompt"
                rows="1"
                placeholder="Message Ello5…"
                required
              ></textarea>
              <button type="submit" id="send" aria-label="Send">
                <span aria-hidden="true">↑</span>
              </button>
            </div>
            <p class="composer-hint">
              Elloten · Ello5 model · <code id="api-host">api.ello5.com</code>
            </p>
          </form>
        </footer>
      </div>
    </div>

    <div class="rail-backdrop" id="rail-backdrop" hidden></div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
