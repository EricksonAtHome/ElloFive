<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ello5 — AI mode</title>
    <meta
      name="description"
      content="Ello5 is only an AI mode. Chat with the Elite Coding System on ello5.com."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <header class="top">
      <a class="brand" href="/" aria-label="Ello5 AI mode home">
        <span class="brand-mark">Ello5</span>
        <span class="brand-mode">AI mode</span>
      </a>
      <div class="meta">
        <span id="host-pill" class="host-pill" title="Hosts">ai · api · ft.svr</span>
        <span id="status" class="status" data-state="loading">…</span>
      </div>
    </header>

    <main class="stage">
      <section class="hero" id="hero">
        <h1 class="logo">Ello5</h1>
        <p class="tagline">
          Only an AI mode — Elite Coding System on
          <span class="mono">ello5.com</span>
        </p>
        <p class="lede">
          Private local reasoning for production software. Ask for secure APIs,
          refactors, tests, or architecture — then ship.
        </p>
        <div class="cta-row">
          <button type="button" class="cta" id="start-chat">Open chat</button>
          <a class="cta ghost" href="/v1/hosts" target="_blank" rel="noreferrer"
            >Hosts</a
          >
        </div>
      </section>

      <section class="chat" id="chat" hidden>
        <div class="thread" id="thread" role="log" aria-live="polite"></div>
        <form class="composer" id="composer">
          <label class="sr-only" for="prompt">Message</label>
          <textarea
            id="prompt"
            name="prompt"
            rows="2"
            placeholder="Ask Ello5 — secure endpoint, refactor, tests…"
            required
          ></textarea>
          <div class="composer-bar">
            <select id="model" name="model" aria-label="Model">
              <option value="ellofive">ellofive · Pro</option>
              <option value="ellofive-fast">ellofive-fast</option>
              <option value="models5">models5</option>
            </select>
            <button type="submit" id="send">Send</button>
          </div>
        </form>
      </section>
    </main>

    <footer class="foot">
      <span
        >Runtime <code id="runtime-host">ft.svr.ello5.com</code> · API
        <code id="api-host">api.ello5.com</code></span
      >
    </footer>

    <script src="/app.js" type="module"></script>
  </body>
</html>
