# Optional nginx map for Ello5 AI mode (ello5.com)
# Upstream: API+UI :3000 · runtime :11434

upstream ello5_api {
    server 127.0.0.1:3000;
}

upstream ello5_runtime {
    server 127.0.0.1:11434;
}

server {
    listen 80;
    server_name ello5.com;
    return 301 https://ai.ello5.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ai.ello5.com api.ello5.com;
    # ssl_certificate     /etc/ssl/ello5/fullchain.pem;
    # ssl_certificate_key /etc/ssl/ello5/privkey.pem;

    location / {
        proxy_pass http://ello5_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }
}

server {
    listen 443 ssl http2;
    server_name ft.svr.ello5.com;
    # ssl_certificate     /etc/ssl/ello5/fullchain.pem;
    # ssl_certificate_key /etc/ssl/ello5/privkey.pem;

    location / {
        proxy_pass http://ello5_runtime;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
    }
}
